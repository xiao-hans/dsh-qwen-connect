name: Grokbot notify

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  notify:
    # Only for human actors who are not the repository owner.
    if: github.actor != github.repository_owner && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      # job-level env can be read in a step `if` (secrets cannot), so we can
      # skip every webhook-related step when the URL is not configured.
      WEBHOOK_URL: ${{ secrets.GROKBOT_WEBHOOK_URL }}
    steps:
      # Body text comes from untrusted user input. It is fed in through an env
      # var, NEVER concatenated into the run script itself. Truncate to 500
      # characters and expose it as a step output via GITHUB_OUTPUT.
      - name: Prepare truncated text
        id: payload
        if: env.WEBHOOK_URL != ''
        env:
          RAW_TEXT: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.pull_request.body || '' }}
        run: |
          delim="GROKBOT_$(python3 -c 'import uuid; print(uuid.uuid4().hex)')"
          {
            printf 'text<<%s\n' "$delim"
            python3 -c 'import os; print(os.environ.get("RAW_TEXT", "")[:500], end="")'
            printf '\n%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # pull_request_target: never checkout or run any untrusted PR code.
      # Every user-controlled string is wrapped in toJSON() so quotes,
      # newlines and braces cannot break the JSON or inject extra fields.
      - name: Send webhook
        if: env.WEBHOOK_URL != ''
        uses: joelwmale/webhook-action@v2.4.2
        with:
          url: ${{ secrets.GROKBOT_WEBHOOK_URL }}
          headers: '{"Authorization": "Bearer ${{ secrets.GROKBOT_WEBHOOK_KEY }}"}'
          body: >-
            {"event": ${{ toJSON(github.event_name) }},
            "action": ${{ toJSON(github.event.action) }},
            "repo": ${{ toJSON(github.repository) }},
            "actor": ${{ toJSON(github.actor) }},
            "number": ${{ toJSON(github.event.issue.number || github.event.pull_request.number || 0) }},
            "title": ${{ toJSON(github.event.issue.title || github.event.pull_request.title || '') }},
            "url": ${{ toJSON(github.event.comment.html_url || github.event.review.html_url || github.event.issue.html_url || github.event.pull_request.html_url || '') }},
            "text": ${{ toJSON(steps.payload.outputs.text) }}}
